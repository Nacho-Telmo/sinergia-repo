<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gradiente de fondo circular -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71" />
      <stop offset="100%" stop-color="#27ae60" />
    </linearGradient>
    
    <!-- Gradiente interno para el anillo decorativo -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>
    
    <!-- Sombra suave para darle profundidad -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fondo circular principal -->
  <circle cx="64" cy="64" r="56" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Anillo decorativo sutil -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="6, 4" opacity="0.8" />

  <!-- Símbolo central: Engranaje estilizado combinado con multimedia / codec -->
  <g fill="#ffffff">
    <!-- Engranaje base (sistema / ajustes) -->
    <path d="M64 42a22 22 0 1 0 0 44 22 22 0 0 0 0-44zm0 34a12 12 0 1 1 0-24 12 12 0 0 1 0 24z" opacity="0.25" />
    
    <!-- Símbolo de reproducción (Play / Códecs multimedia) superpuesto -->
    <polygon points="54,44 78,64 54,84" fill="#ffffff" filter="url(#shadow)" />
    
    <!-- Puntos decorativos de conectividad / fuentes -->
    <circle cx="36" cy="46" r="4" />
    <circle cx="92" cy="46" r="4" />
    <circle cx="36" cy="82" r="4" />
    <circle cx="92" cy="82" r="4" />
  </g>
</svg>
conky.config = {
    alignment = 'top_right',
    background = false,
    cpu_avg_samples = 2,
    default_color = 'ffffff',
    double_buffer = true,
    no_buffers = true,
    update_interval = 1.0,
    font = 'DejaVu Sans Mono:size=10',
    gap_x = 40,
    gap_y = 40,
    minimum_width = 300,
    minimum_height = 140,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    click_through = true,
    uppercase = false,
    use_xft = true,
};
conky.text = [[
${alignc}${color 00acc1}${font DejaVu Sans Mono:bold:size=10}${execi 3600 awk -F= '/^PRETTY_NAME=/ {print $2}' /etc/os-release | tr -d '"'} • ${execi 3600 echo ${XDG_CURRENT_DESKTOP}}${font}${color}
${alignc}${voffset 4}${color ffffff}${font DejaVu Sans Mono:bold:size=38}${time %H:%M}${font}${color}
${alignc}${voffset 2}${color aaaaaa}${font DejaVu Sans Mono:size=9}${time %A}, ${time %d} de ${time %B}${font}${color}
]];

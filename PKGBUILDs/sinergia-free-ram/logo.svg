<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Fondo con esquinas redondeadas -->
  <rect width="128" height="128" rx="28" fill="#11111b" />
  
  <!-- Pines / Conectores del chip (Estilo CPU) -->
  <g fill="#45475a">
    <rect x="36" y="10" width="8" height="12" rx="2" />
    <rect x="60" y="10" width="8" height="12" rx="2" />
    <rect x="84" y="10" width="8" height="12" rx="2" />
    
    <rect x="36" y="106" width="8" height="12" rx="2" />
    <rect x="60" y="106" width="8" height="12" rx="2" />
    <rect x="84" y="106" width="8" height="12" rx="2" />
    
    <rect x="10" y="36" width="12" height="8" rx="2" />
    <rect x="10" y="60" width="12" height="8" rx="2" />
    <rect x="10" y="84" width="12" height="8" rx="2" />
    
    <rect x="106" y="36" width="12" height="8" rx="2" />
    <rect x="106" y="60" width="12" height="8" rx="2" />
    <rect x="106" y="84" width="12" height="8" rx="2" />
  </g>

  <!-- Cuerpo principal del Chip -->
  <rect x="24" y="24" width="80" height="80" rx="16" fill="#1e1e2e" stroke="#313244" stroke-width="4" />

  <!-- Líneas de circuito internas decorativas -->
  <path d="M 40 40 L 56 40 L 64 48" fill="none" stroke="#313244" stroke-width="3" stroke-linecap="round" />
  <path d="M 88 88 L 72 88 L 64 80" fill="none" stroke="#313244" stroke-width="3" stroke-linecap="round" />

  <!-- Núcleo central / Indicadores de RAM en forma de barras apiladas -->
  <!-- Barra Superior (Azul Sinergia) -->
  <rect x="38" y="42" width="52" height="12" rx="4" fill="#89b4fa" />
  <!-- Barra Inferior (Verde Memoria / Limpieza) -->
  <rect x="38" y="62" width="36" height="12" rx="4" fill="#a6e3a1" />

  <!-- Pequeño punto indicador de estado activo -->
  <circle cx="86" cy="68" r="4" fill="#f38ba8" />
</svg>
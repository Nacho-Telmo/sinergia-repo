<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo oscuro estilo Plasma -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2b2b" />
      <stop offset="100%" stop-color="#1e1e1e" />
    </linearGradient>

    <!-- Gradiente vibrante para conectividad (Azul Sinergia / Cyan) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3daee9" />
      <stop offset="100%" stop-color="#2980b9" />
    </linearGradient>

    <!-- Gradiente secundario de acento (Verde técnico / Éxito) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71" />
      <stop offset="100%" stop-color="#27ae60" />
    </linearGradient>

    <!-- Sombra suave para profundidad -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fondo redondeado del icono de la aplicación -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="#3a3a3a" stroke-width="8" filter="url(#dropShadow)" />

  <!-- Ondas de transmisión de red (Wi-Fi / Local) -->
  <g opacity="0.8">
    <path d="M 128 200 A 100 100 0 0 1 384 200" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" />
    <path d="M 160 236 A 64 64 0 0 1 352 236" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Contenedor central (Simbolizando el QR / Compartir Archivo) -->
  <g transform="translate(144, 160)">
    <!-- Marco principal del QR/Archivo -->
    <rect x="0" y="0" width="224" height="224" rx="24" fill="#22252a" stroke="url(#primaryGrad)" stroke-width="10" />

    <!-- Elementos esquineros estilo Código QR -->
    <rect x="28" y="28" width="56" height="56" rx="10" fill="url(#primaryGrad)" />
    <rect x="44" y="44" width="24" height="24" rx="4" fill="#22252a" />

    <rect x="140" y="28" width="56" height="56" rx="10" fill="url(#primaryGrad)" />
    <rect x="156" y="44" width="24" height="24" rx="4" fill="#22252a" />

    <rect x="28" y="140" width="56" height="56" rx="10" fill="url(#primaryGrad)" />
    <rect x="44" y="156" width="24" height="24" rx="4" fill="#22252a" />

    <!-- Puntos de datos y flecha central de transferencia -->
    <circle cx="168" cy="168" r="14" fill="url(#accentGrad)" />
    <rect x="112" y="112" width="24" height="24" rx="4" fill="#ffffff" opacity="0.9" />
    <rect x="112" y="76" width="24" height="24" rx="4" fill="#ffffff" opacity="0.6" />
    <rect x="76" y="112" width="24" height="24" rx="4" fill="#ffffff" opacity="0.6" />
  </g>
</svg>